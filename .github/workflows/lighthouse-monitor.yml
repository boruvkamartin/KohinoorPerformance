name: Lighthouse monitor

on:
  schedule:
    # Den 8:07–22:46 Europe/Prague (~20 min, mimo špičku :00/:20/:40)
    - cron: '7,26,46 8-22 * * *'
      timezone: Europe/Prague
    # 23:07 poslední denní běh
    - cron: '7 23 * * *'
      timezone: Europe/Prague
    # Noc 23:37 a 00:07–07:37 každých 30 min
    - cron: '37 23 * * *'
      timezone: Europe/Prague
    - cron: '7,37 0-7 * * *'
      timezone: Europe/Prague
  workflow_dispatch:

concurrency:
  group: lighthouse-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Run Lighthouse audits
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          METRICS_PATH: public/data/metrics.json
          REPORTS_DIR: artifacts/lighthouse
        run: node scripts/run-lighthouse.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: artifacts/lighthouse
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/metrics.json
          if git diff --cached --quiet; then
            echo "No metric changes"
            exit 0
          fi
          git commit -m "chore: update lighthouse metrics"
          git pull --rebase --autostash origin main
          git push
