name: CrUX field data

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

concurrency:
  group: crux-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Chrome UX Report
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          CRUX_PATH: public/data/crux.json
        run: node scripts/fetch-crux.mjs

      - name: Commit CrUX data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/crux.json
          if git diff --cached --quiet; then
            echo "No CrUX changes"
            exit 0
          fi
          git commit -m "chore: update Chrome UX Report metrics"
          git pull --rebase --autostash origin main
          git push
